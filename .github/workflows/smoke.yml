name: Smoke test (live site)
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      review:
        description: 'Run the close-the-week test (spends model quota)'
        type: boolean
        default: false
      generate:
        description: 'Also run the plan-generation test (spends model quota)'
        type: boolean
        default: false
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      CADENCE_URL: ${{ secrets.CADENCE_URL }}
      CADENCE_TEST_EMAIL: ${{ secrets.CADENCE_TEST_EMAIL }}
      CADENCE_TEST_PASSWORD: ${{ secrets.CADENCE_TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Secrets present
        run: test -n "$CADENCE_URL" && test -n "$CADENCE_TEST_EMAIL" && test -n "$CADENCE_TEST_PASSWORD"
      - name: Wait for Vercel deployment
        run: sleep 90
      - run: npm i -D @playwright/test@1.47.2 && npx playwright install --with-deps chromium
      # One step per test so a failure is identifiable from the job summary alone
      - name: 'Test: site and API routes'
        if: always()
        run: npx playwright test -g "site and API routes"
      - name: 'Test: sign in and tabs'
        if: always()
        run: npx playwright test -g "sign in and tabs"
      - name: 'Test: today fits one screen'
        if: always()
        run: npx playwright test -g "today fits one screen"
      - name: 'Today: publish measurements'
        if: always()
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}', RESULT_FILE: 'today-result.json' }
        run: node publish-result.mjs || true
      - name: 'Test: dark theme'
        if: always()
        run: npx playwright test -g "dark theme applies"
      - name: 'Test: plan and session view'
        if: always()
        run: npx playwright test -g "plan and session view"
      - name: 'Test: nutrition and club render'
        if: always()
        run: npx playwright test -g "nutrition and club render"
      - name: 'Generate: run'
        if: inputs.generate
        env: { RUN_GENERATE: '1' }
        run: npx playwright test -g "generate a plan end to end"
      - name: 'Generate: publish result'
        if: inputs.generate && always()
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: node publish-result.mjs
      - name: 'Generate: reached the API'
        if: inputs.generate && always()
        run: node check-gen.mjs reached-api
      - name: 'Generate: not a timeout'
        if: inputs.generate && always()
        run: node check-gen.mjs not-timeout
      - name: 'Generate: not 429 quota'
        if: inputs.generate && always()
        run: node check-gen.mjs not-quota
      - name: 'Generate: not 401/403 auth'
        if: inputs.generate && always()
        run: node check-gen.mjs not-auth
      - name: 'Generate: not 400 bad request'
        if: inputs.generate && always()
        run: node check-gen.mjs not-bad-request
      - name: 'Generate: not 500 server error'
        if: inputs.generate && always()
        run: node check-gen.mjs not-server-error
      - name: 'Generate: HTTP 200'
        if: inputs.generate && always()
        run: node check-gen.mjs http-200
      - name: 'Generate: 7 day rows'
        if: inputs.generate && always()
        run: node check-gen.mjs seven-days
      - name: 'Generate: has trainable sessions'
        if: inputs.generate && always()
        run: node check-gen.mjs has-sessions
      - name: 'Generate: session view renders'
        if: inputs.generate && always()
        run: node check-gen.mjs session-view
      - name: 'Generate: all 7 days shown'
        if: inputs.generate && always()
        run: node check-gen.mjs all-days-shown
      - name: 'Generate: nothing wider than the screen'
        if: inputs.generate && always()
        run: node check-gen.mjs layout-fits
      - name: 'Generate: no overlapping labels'
        if: inputs.generate && always()
        run: node check-gen.mjs no-overlap
      - name: 'Generate: no page errors'
        if: inputs.generate && always()
        run: node check-gen.mjs no-page-errors
      - name: 'Meal photo: run'
        if: inputs.generate && always()
        env: { RUN_MEAL: '1' }
        run: npx playwright test -g "meal photo estimate"
      - name: 'Meal photo: publish result'
        if: inputs.generate && always()
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}', RESULT_FILE: 'meal-result.json' }
        run: node publish-result.mjs
      - name: 'Day prefs: run'
        if: always()
        env: { RUN_DAYPREFS: '1' }
        run: npx playwright test -g "per-day preferences render and save"
      - name: 'Day prefs: publish result'
        if: always()
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}', RESULT_FILE: 'dayprefs-result.json' }
        run: node publish-result.mjs
      - name: 'Photo: run'
        if: always()
        env: { RUN_PHOTO: '1' }
        run: npx playwright test -g "meal photo estimation"
      - name: 'Photo: publish result'
        if: always()
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}', RESULT_FILE: 'photo-result.json' }
        run: node publish-result.mjs
      - name: 'Review: run'
        if: inputs.review
        env: { RUN_REVIEW: '1' }
        run: npx playwright test -g "close the week"
      - name: 'Review: publish result'
        if: inputs.review && always()
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}', RESULT_FILE: 'review-result.json' }
        run: node publish-result.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: test-results/ }
